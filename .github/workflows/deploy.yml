# main에 올라갈 때마다 시험 → 빌드 → GitHub Pages 배포
# 처음 한 번: 저장소 Settings → Pages → Source를 「GitHub Actions」로
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      # build.py가 번체판(zh-hant/)을 OpenCC로 만든다
      - run: pip install opencc-python-reimplemented
      # build.py가 앱 아이콘을 Playwright Chromium으로 찍는다(tools/icon.py)
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: npm test
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
